# Held-out LTLf+ obligations covering the formula families used for training.
- "∃(F purple)"
- "∃(F brown)"
- "∃(F(purple & F brown))"
- "∃(F(green & F pink))"
- "∃((!orange) U purple)"
- "∃((!gray) U green)"
- "∃(F(purple & N(brown)))"
- "∃(F(green & N(pink)))"
- "∀(purple -> N(brown))"
- "∀(green -> N(pink))"
- "∀∃(F purple)"
- "∀∃(F green)"
- "∀∃(F purple) & ∀(G(!orange))"
- "∀∃(F green) & ∀(G(!(gray | red)))"
